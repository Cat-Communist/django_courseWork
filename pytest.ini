[pytest]
DJANGO_SETTINGS_MODULE = app.settings
python_files = tests.py test_*.py *_tests.py
addopts = -s -v --cache-clear --color=yes --code-highlight=yes --showlocals
        # '-s' отменяет захват консольного вывода         
        # '-v' больше словесного описания результата теста
        # '-cache_clear' очистка кеша из .pytest_cache
        # '-color' делает красоту с цветами      
        # '-code-highlight' делает красоту с кодом   